<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HT-STORE | Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">DC-STORE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/boutique">Boutique</a>

                {% if session.get('user_email') %}
                    <span class="nav-link text-info">Connecté : {{ session['user_email'] }}</span>
                    <a class="nav-link text-danger" href="/logout">Déconnexion</a>
                {% else %}
                    <a class="nav-link" href="/login">Connexion</a>
                    <a class="nav-link" href="/inscription">S'inscrire</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container text-center mt-5">
        <h1>Bienvenue sur DC-STORE</h1>
        <p class="lead">Le site e-commerce simple et efficace.</p>
        <hr>
        <a href="/boutique" class="btn btn-primary btn-lg">Voir les produits</a>
    </div>

</body>
</html>
