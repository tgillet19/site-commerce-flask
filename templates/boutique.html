<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>High-Tech | Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { border: none; border-radius: 20px; transition: all 0.3s ease; background: white; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1) !important; }
        .img-container { height: 200px; overflow: hidden; border-radius: 20px 20px 0 0; background-color: #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">DC-STORE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Accueil</a>
                <a class="nav-link active" href="/boutique">Boutique</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">Notre Boutique</h1>
            <p class="text-muted">Produits chargés depuis la base de données MySQL</p>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for p in produits %}
            <div class="col">
                <div class="card h-100 product-card shadow-sm">
                    <div class="img-container">
                        <img src="{{ p.image }}" alt="{{ p.nom }}">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold">{{ p.nom }}</h5>
                        <div class="mt-auto d-flex justify-content-between align-items-center mt-3">
                            <span class="h4 mb-0 text-primary">{{ p.prix }} €</span>
                            <button onclick="alert('🛒 Ajouté au panier !')" class="btn btn-dark">Acheter</button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
